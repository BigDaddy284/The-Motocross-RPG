name: Test and publish

on:
  push:
    branches: [main, test/v1.5]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# The test build published beside the main game (Boss, 28 and 30 Oct 2026): main stays at the
# site's address and the test branch goes in a folder of its own, with its own saves. Ask Boss
# before changing PREVIEW_BRANCH or PREVIEW_PATH to a new test version.
env:
  PREVIEW_BRANCH: test/v1.5
  PREVIEW_PATH: test-v1.5

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Builds the site: main at the root and the test branch in PREVIEW_PATH, so publishing from
  # either branch keeps both. Runs on pushes to main or the test branch.
  site:
    needs: test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test/v1.5')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/checkout@v4
        id: preview
        continue-on-error: true
        with:
          ref: ${{ env.PREVIEW_BRANCH }}
          path: preview
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: main/package-lock.json
      - name: Build main
        working-directory: main
        run: npm ci && npm run build
      - name: Build the test branch into its folder
        if: steps.preview.outcome == 'success'
        working-directory: preview
        env:
          VITE_STORE_NAMESPACE: "mxrpg-${{ env.PREVIEW_PATH }}:"
        run: |
          npm ci && npm run build
          cp -r dist "../main/dist/$PREVIEW_PATH"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: main/dist

  # Publishes the playable build to GitHub Pages. Needs Settings > Pages > Source: GitHub Actions,
  # and the test branch allowed in Settings > Environments > github-pages (deployment branches).
  deploy:
    needs: site
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
